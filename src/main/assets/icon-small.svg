<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- 小尺寸（16/24 与托盘）简化版：笔记本 + 三条横线 + 三个装订环，描边加粗保证缩小后不断裂。
       颜色取自源图：#1F6FEB 描边 / #D7E5FB 内页。 -->
  <rect x="14" y="6" width="46" height="52" rx="8" fill="#D7E5FB" stroke="#1F6FEB" stroke-width="4"/>
  <line x1="23" y1="12" x2="23" y2="52" stroke="#1F6FEB" stroke-width="3.5"/>
  <g fill="none" stroke="#1F6FEB" stroke-width="3.5">
    <circle cx="14" cy="16" r="5"/>
    <circle cx="14" cy="32" r="5"/>
    <circle cx="14" cy="48" r="5"/>
  </g>
  <g stroke="#1F6FEB" stroke-width="3.5" stroke-linecap="round">
    <line x1="31" y1="21" x2="52" y2="21"/>
    <line x1="31" y1="32" x2="52" y2="32"/>
    <line x1="31" y1="43" x2="52" y2="43"/>
  </g>
</svg>
