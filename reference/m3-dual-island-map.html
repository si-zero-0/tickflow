<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TickFlow M3 双岛 · 可编辑功能树</title>
<style>
  :root{
    --bg:#F7F8FA; --panel:#FFFFFF; --text:#1F2329; --muted:#646A73;
    --line:#D0D3D9; --line-strong:#9AA3AF; --box:#F2F3F5; --box-border:#E1E4E9;
    --root:#3370FF; --root-2:#245BDB; --accent:#3370FF; --accent-soft:rgba(51,112,255,.16);
    --hit:#FFE58F; --shadow:0 1px 2px rgba(31,35,41,.05),0 4px 12px rgba(31,35,41,.04);
    --nodebar-bg:rgba(255,255,255,.92);
  }
  body[data-theme="dark"]{
    --bg:#0E1015; --panel:#171A21; --text:#E6E8EB; --muted:#9AA0A6;
    --line:#2C313C; --line-strong:#5A6272; --box:#1B1F27; --box-border:#2A2F3A;
    --root:#4C8DFF; --root-2:#3B7BEA; --accent:#6EA8FF; --accent-soft:rgba(110,168,255,.2);
    --hit:#6B5A1F; --shadow:0 1px 2px rgba(0,0,0,.28),0 8px 22px rgba(0,0,0,.24);
    --nodebar-bg:rgba(23,26,33,.94);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;overflow:hidden;}
  body{
    display:flex;flex-direction:column;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei UI","Microsoft YaHei","PingFang SC",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{
    flex:none;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line);
    box-shadow:0 1px 0 rgba(0,0,0,.02);z-index:20;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:260px;}
  .logo{
    width:34px;height:34px;border-radius:9px;background:linear-gradient(160deg,var(--root),var(--root-2));
    color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center;letter-spacing:.2px;
    box-shadow:0 4px 12px rgba(51,112,255,.28);
  }
  .brand h1{font-size:15px;line-height:1.2;margin:0;font-weight:700;letter-spacing:.2px;}
  .brand p{font-size:11.5px;line-height:1.3;margin:2px 0 0;color:var(--muted);}
  .tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-left:auto;}
  .tools input[type="search"]{
    width:190px;height:30px;border:1px solid var(--line);border-radius:7px;background:var(--bg);
    color:var(--text);padding:0 10px;font-size:12px;outline:none;transition:border-color .15s,box-shadow .15s;
  }
  .tools input[type="search"]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .tools input::placeholder{color:var(--muted);}
  .tbtn{
    height:30px;padding:0 9px;border:1px solid transparent;border-radius:7px;background:transparent;
    color:var(--muted);font-size:12px;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s,border-color .12s;
  }
  .tbtn:hover{background:var(--box);color:var(--text);border-color:var(--box-border);}
  .tbtn:active{transform:translateY(1px);}
  .tbtn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  .tbtn.primary:hover{filter:brightness(1.05);color:#fff;}
  .zoom-wrap{display:flex;align-items:center;gap:2px;padding:0 4px;border-left:1px solid var(--line);margin-left:2px;}
  #zoomLabel{min-width:38px;text-align:center;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;}
  #viewport{
    flex:1;overflow:auto;position:relative;cursor:grab;background:
      radial-gradient(circle at 1px 1px, rgba(127,127,127,.13) 1px, transparent 0) 0 0/22px 22px;
  }
  #viewport.dragging{cursor:grabbing;}
  #canvas{
    position:relative;display:inline-block;min-width:100%;min-height:100%;
    padding:40px 64px;transform-origin:0 0;
  }
  #nodes{position:relative;z-index:2;display:inline-block;}
  #links{position:absolute;left:0;top:0;z-index:1;pointer-events:none;overflow:visible;}
  #links path{fill:none;stroke:var(--line-strong);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  .node{display:flex;align-items:center;gap:30px;position:relative;}
  .kids{display:flex;flex-direction:column;justify-content:center;gap:5px;}
  .box{
    position:relative;display:flex;flex-direction:column;gap:3px;min-width:104px;max-width:330px;
    padding:7px 11px;border:1px solid var(--box-border);border-radius:8px;background:var(--box);
    box-shadow:var(--shadow);cursor:default;transition:border-color .12s,box-shadow .12s,background .12s;
  }
  .box:hover{border-color:var(--line-strong);}
  .box.selected{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow);}
  .box.root{
    background:linear-gradient(160deg,var(--root),var(--root-2));border-color:var(--root);
    color:#fff;padding:12px 20px;min-width:154px;max-width:380px;border-radius:10px;
    box-shadow:0 10px 28px rgba(51,112,255,.26);
  }
  .label{
    font-size:13px;line-height:1.38;font-weight:600;letter-spacing:.1px;
    white-space:pre-wrap;word-break:break-word;outline:none;border-radius:3px;
  }
  .box.root .label{font-size:17px;font-weight:750;letter-spacing:.3px;}
  .note{font-size:11px;line-height:1.45;color:var(--muted);white-space:pre-wrap;word-break:break-word;max-width:306px;}
  .box.root .note{color:rgba(255,255,255,.78);font-size:11.5px;max-width:340px;}
  .label[contenteditable="true"]{
    background:var(--panel);box-shadow:0 0 0 2px var(--accent);padding:0 3px;margin:0 -3px;
    cursor:text;user-select:text;
  }
  .box.root .label[contenteditable="true"]{color:var(--text);}
  .label.hit{background:var(--hit);box-shadow:0 0 0 2px var(--hit);}
  .box.root .label.hit{color:#1F2329;}

  .toggle{
    position:absolute;right:-27px;top:50%;transform:translate(50%,-50%);
    width:20px;height:20px;padding:0;border:1px solid var(--line-strong);border-radius:50%;
    background:var(--panel);color:var(--text);font-size:13px;font-weight:600;line-height:1;
    display:grid;place-items:center;cursor:pointer;z-index:4;
    box-shadow:0 1px 3px rgba(0,0,0,.08);transition:background .12s,color .12s,border-color .12s;
  }
  .toggle:hover{background:var(--accent);border-color:var(--accent);color:#fff;}
  .toggle.leaf-add{opacity:0;pointer-events:none;}
  .box:hover .toggle.leaf-add,.box.selected .toggle.leaf-add{opacity:1;pointer-events:auto;}

  #nodebar{
    position:fixed;left:50%;bottom:52px;transform:translateX(-50%) translateY(6px);
    display:none;align-items:center;gap:4px;padding:6px;border:1px solid var(--line);
    border-radius:10px;background:var(--nodebar-bg);backdrop-filter:blur(10px);
    box-shadow:0 12px 32px rgba(0,0,0,.16);z-index:60;opacity:0;transition:opacity .16s,transform .16s;
  }
  #nodebar.show{display:flex;opacity:1;transform:translateX(-50%) translateY(0);}
  #nodebar-title{max-width:180px;padding:0 8px;font-size:11.5px;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--line);}
  .nbtn{height:26px;padding:0 8px;border:1px solid transparent;border-radius:6px;background:transparent;
    color:var(--text);font-size:11.5px;cursor:pointer;white-space:nowrap;}
  .nbtn:hover{background:var(--box);border-color:var(--box-border);}
  .nbtn.danger{color:#D63A57;}
  .nbtn.danger:hover{background:rgba(214,58,87,.1);border-color:rgba(214,58,87,.3);}
  .nbtn:disabled{opacity:.35;cursor:not-allowed;}

  footer{
    flex:none;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:7px 18px;background:var(--panel);border-top:1px solid var(--line);
    color:var(--muted);font-size:11px;z-index:20;
  }
  footer b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums;}
  footer .hint{margin-left:auto;}

  #toast{
    position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(8px);
    padding:8px 14px;border-radius:8px;background:#1F2329;color:#fff;font-size:12px;
    opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:80;
    box-shadow:0 10px 26px rgba(0,0,0,.22);
  }
  body[data-theme="dark"] #toast{background:#E6E8EB;color:#15171A;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (max-width:1100px){
    header{gap:10px;padding:10px 12px;}
    .brand{min-width:180px;}
    .brand p{display:none;}
    .tools input[type="search"]{width:138px;}
    .tbtn{padding:0 6px;font-size:11.5px;}
  }
  @media (max-width:900px){
    header{gap:10px;padding:10px 12px;}
    .brand{min-width:0;}
    .brand p{display:none;}
    .tools input[type="search"]{width:140px;}
    .tbtn{padding:0 7px;}
    #canvas{padding:28px 24px;}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important;}
  }
</style>
</head>
<body data-theme="light">
<header>
  <div class="brand">
    <div class="logo">M3</div>
    <div>
      <h1>M3 双岛 · 功能树</h1>
      <p>底部主岛保留 + 顶部迷你岛新增 · 两套状态同步</p>
    </div>
  </div>
  <div class="tools">
    <input id="search" type="search" placeholder="搜索功能…" autocomplete="off" aria-label="搜索功能">
    <button class="tbtn" data-act="expand-all" title="展开所有节点">展开全部</button>
    <button class="tbtn" data-act="collapse-all" title="折叠到一级分支">折叠全部</button>
    <button class="tbtn" data-act="fit" title="缩放到适应窗口">适应</button>
    <span class="zoom-wrap">
      <button class="tbtn" data-act="zoom-out" title="缩小">−</button>
      <span id="zoomLabel">100%</span>
      <button class="tbtn" data-act="zoom-in" title="放大">+</button>
    </span>
    <button class="tbtn" data-act="export" title="导出 JSON（可进版本库）">导出</button>
    <button class="tbtn" data-act="import" title="导入 JSON">导入</button>
    <button class="tbtn" data-act="reset" title="恢复默认树">重置</button>
    <button class="tbtn" data-act="theme" id="themeBtn" title="切换明暗">深色</button>
  </div>
</header>

<div id="viewport" tabindex="0">
  <div id="canvas">
    <svg id="links" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="nodes"></div>
  </div>
</div>

<div id="nodebar" role="toolbar" aria-label="节点操作">
  <span id="nodebar-title">未选中</span>
  <button class="nbtn" data-node-act="child">+ 子节点</button>
  <button class="nbtn" data-node-act="sibling">+ 同级</button>
  <button class="nbtn" data-node-act="rename">重命名</button>
  <button class="nbtn" data-node-act="toggle">折叠</button>
  <button class="nbtn danger" data-node-act="delete">删除</button>
</div>

<footer>
  <span><b id="stat-nodes">0</b> 节点 · <b id="stat-leaves">0</b> 叶子 · <b id="stat-depth">0</b> 层</span>
  <span id="saveState">自动保存</span>
  <span class="hint">双击文字编辑 · 节点右侧 +/− 增删/折叠 · 选中后底部工具栏 · Ctrl+Z/Y 撤销重做</span>
</footer>

<div id="toast" role="status" aria-live="polite"></div>
<input id="file-input" type="file" accept=".json,application/json" hidden>

/* ============================================================
   2. 状态与工具
   ============================================================ */
const LS_TREE = 'tf-m3-dual-island-tree-v1';
const LS_UI = 'tf-m3-dual-island-ui-v1';
const state = {
  tree: null, selected: null, hits: new Set(),
  scale: 1, theme: 'light', history: [], future: [],
};

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const viewport = $('#viewport');
const canvas = $('#canvas');
const nodesEl = $('#nodes');
const links = $('#links');
const nodebar = $('#nodebar');
const toastEl = $('#toast');

function newId(){ return 'n' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3); }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function build(arr, depth){
  const [label, note, kids, expanded] = arr;
  const node = { id: newId(), label: label || '未命名', note: note || '', children: [], collapsed: false };
  if (Array.isArray(kids) && kids.length) {
    node.children = kids.map(k => build(k, depth + 1));
    node.collapsed = !(expanded === true || depth === 0);
  }
  return node;
}

function defaultTree(){ uid = 0; return build(RAW, 0); }

function normalize(node){
  if (!node || typeof node !== 'object') return null;
  const out = {
    id: typeof node.id === 'string' && node.id ? node.id : newId(),
    label: typeof node.label === 'string' && node.label.trim() ? node.label.trim() : '未命名',
    note: typeof node.note === 'string' ? node.note : '',
    children: [],
    collapsed: !!node.collapsed,
  };
  if (Array.isArray(node.children)) out.children = node.children.map(normalize).filter(Boolean);
  return out;
}

function walk(node, fn, parent){
  fn(node, parent);
  node.children.forEach(c => walk(c, fn, node));
}
function findNode(id){
  let hit = null;
  walk(state.tree, n => { if (n.id === id) hit = n; });
  return hit;
}
function findParent(id){
  let hit = null;
  walk(state.tree, (n, p) => { if (n.id === id) hit = p; });
  return hit;
}
function countTree(node){
  let nodes = 0, leaves = 0, maxDepth = 0;
  const rec = (n, d) => {
    nodes++; maxDepth = Math.max(maxDepth, d);
    if (!n.children.length) leaves++;
    n.children.forEach(c => rec(c, d + 1));
  };
  rec(node, 1);
  return { nodes, leaves, maxDepth };
}

/* ---------- 历史 / 保存 ---------- */
let saveTimer = 0;
function snapshot(){
  state.history.push(JSON.stringify(state.tree));
  if (state.history.length > 60) state.history.shift();
  state.future = [];
}
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(LS_TREE, JSON.stringify(state.tree));
      localStorage.setItem(LS_UI, JSON.stringify({ theme: state.theme, scale: state.scale }));
      $('#saveState').textContent = '已保存 ' + new Date().toLocaleTimeString('zh-CN', {hour12:false});
    } catch (e) {
      $('#saveState').textContent = '保存失败';
    }
  }, 220);
}
function undo(){
  if (document.activeElement && document.activeElement.isContentEditable) return;
  if (!state.history.length) return;
  state.future.push(JSON.stringify(state.tree));
  state.tree = normalize(JSON.parse(state.history.pop()));
  state.selected = null;
  save(); render(); drawLinks(); showToast('已撤销');
}
function redo(){
  if (document.activeElement && document.activeElement.isContentEditable) return;
  if (!state.future.length) return;
  state.history.push(JSON.stringify(state.tree));
  state.tree = normalize(JSON.parse(state.future.pop()));
  state.selected = null;
  save(); render(); drawLinks(); showToast('已重做');
}

/* ---------- toast ---------- */
let toastTimer = 0;
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
}

/* ============================================================
   3. 渲染
   ============================================================ */
function render(){
  nodesEl.innerHTML = '';
  if (!state.tree) return;
  nodesEl.appendChild(renderNode(state.tree, 0));
  updateStats();
  requestAnimationFrame(() => {
    drawLinks();
    if (state.selected) select(state.selected);
  });
}

function renderNode(node, depth){
  const wrap = document.createElement('div');
  wrap.className = 'node depth-' + depth;
  wrap.dataset.id = node.id;

  const box = document.createElement('div');
  box.className = 'box' + (depth === 0 ? ' root' : '');
  box.dataset.id = node.id;

  const label = document.createElement('div');
  label.className = 'label';
  label.dataset.id = node.id;
  label.textContent = node.label;
  label.contentEditable = 'false';
  label.spellcheck = false;
  label.setAttribute('role', 'textbox');
  label.setAttribute('aria-label', '节点名称，双击编辑');
  label.addEventListener('dblclick', e => { e.stopPropagation(); startEdit(label, node); });
  label.addEventListener('input', () => requestAnimationFrame(drawLinks));

  const note = document.createElement('div');
  note.className = 'note';
  note.textContent = node.note || '';
  note.style.display = node.note ? '' : 'none';

  box.appendChild(label);
  box.appendChild(note);
  box.addEventListener('click', e => {
    if (e.target.closest('button')) return;
    select(node.id);
  });

  if (node.children.length) {
    const t = document.createElement('button');
    t.className = 'toggle';
    t.type = 'button';
    t.textContent = node.collapsed ? '+' : '−';
    t.title = node.collapsed ? '展开' : '折叠';
    t.setAttribute('aria-label', t.title);
    t.addEventListener('click', e => {
      e.stopPropagation();
      snapshot();
      node.collapsed = !node.collapsed;
      if (node.collapsed && state.selected && isDescendant(node, state.selected)) state.selected = node.id;
      save(); render(); drawLinks();
    });
    box.appendChild(t);
  } else {
    const add = document.createElement('button');
    add.className = 'toggle leaf-add';
    add.type = 'button';
    add.textContent = '+';
    add.title = '添加子节点';
    add.setAttribute('aria-label', '添加子节点');
    add.addEventListener('click', e => { e.stopPropagation(); addChild(node); });
    box.appendChild(add);
  }

  wrap.appendChild(box);
  if (node.children.length && !node.collapsed) {
    const kids = document.createElement('div');
    kids.className = 'kids';
    node.children.forEach(c => kids.appendChild(renderNode(c, depth + 1)));
    wrap.appendChild(kids);
  }
  return wrap;
}

function isDescendant(parent, id){
  if (!parent || !id) return false;
  let found = false;
  walk(parent, n => { if (n.id === id && n !== parent) found = true; });
  return found;
}

/* ---------- 连线 ---------- */
let linkRaf = 0;
function drawLinks(){
  cancelAnimationFrame(linkRaf);
  linkRaf = requestAnimationFrame(() => {
    if (!state.tree) return;
    const z = state.scale || 1;
    const cr = canvas.getBoundingClientRect();
    const boxes = new Map();
    $$('.box').forEach(b => {
      const r = b.getBoundingClientRect();
      boxes.set(b.dataset.id, {
        left: (r.left - cr.left) / z,
        top: (r.top - cr.top) / z,
        right: (r.right - cr.left) / z,
        bottom: (r.bottom - cr.top) / z,
      });
    });

    const paths = [];
    $$('.node').forEach(wrap => {
      const kidsEl = wrap.querySelector(':scope > .kids');
      if (!kidsEl) return;
      const p = boxes.get(wrap.dataset.id);
      const children = Array.from(kidsEl.children).map(k => boxes.get(k.dataset.id)).filter(Boolean);
      if (!p || !children.length) return;

      const y1 = (p.top + p.bottom) / 2;
      const x1 = p.right;
      const x2 = Math.min(...children.map(c => c.left));
      const mid = x1 + Math.max(18, (x2 - x1) * 0.46);
      const yOf = c => (c.top + c.bottom) / 2;
      const firstY = yOf(children[0]);
      const lastY = yOf(children[children.length - 1]);

      // 父节点到主干的横线
      paths.push('M ' + x1 + ' ' + y1 + ' H ' + mid);
      // 主干（首个孩子中心 → 末个孩子中心）
      if (Math.abs(lastY - firstY) > 0.5) {
        paths.push('M ' + mid + ' ' + firstY + ' V ' + lastY);
      }
      // 每个孩子的圆角肘线
      children.forEach(c => {
        const y = yOf(c);
        const r = Math.min(7, Math.max(3, (c.left - mid) / 2));
        paths.push('M ' + mid + ' ' + (y - r) + ' Q ' + mid + ' ' + y + ' ' + (mid + r) + ' ' + y + ' H ' + c.left);
      });
    });

    links.innerHTML = paths.map(d => '<path d="' + d + '"/>').join('');
    links.setAttribute('width', canvas.scrollWidth);
    links.setAttribute('height', canvas.scrollHeight);
    links.setAttribute('viewBox', '0 0 ' + canvas.scrollWidth + ' ' + canvas.scrollHeight);
  });
}

/* ---------- 选中 / 工具栏 ---------- */
function select(id){
  state.selected = id;
  $$('.box.selected').forEach(b => b.classList.remove('selected'));
  const box = document.querySelector('.box[data-id="' + id + '"]');
  if (box) box.classList.add('selected');
  const node = findNode(id);
  if (!node) { hideNodebar(); return; }
  $('#nodebar-title').textContent = node.label;
  const isRoot = id === state.tree.id;
  $('[data-node-act="sibling"]').disabled = isRoot;
  $('[data-node-act="delete"]').disabled = isRoot;
  $('[data-node-act="toggle"]').disabled = !node.children.length;
  $('[data-node-act="toggle"]').textContent = node.collapsed ? '展开' : '折叠';
  nodebar.classList.add('show');
}
function hideNodebar(){ nodebar.classList.remove('show'); }
function markSelected(id){
  const box = document.querySelector('.box[data-id="' + id + '"]');
  if (box) box.classList.add('selected');
}
function clearSelection(){
  state.selected = null;
  $$('.box.selected').forEach(b => b.classList.remove('selected'));
  hideNodebar();
}

/* ============================================================
   4. 编辑 / 增删
   ============================================================ */
function startEdit(label, node, skipHistory){
  if (label.isContentEditable) return;
  if (!skipHistory) snapshot();
  label.dataset.old = node.label;
  label.contentEditable = 'true';
  label.focus();
  const range = document.createRange();
  range.selectNodeContents(label);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);

  const finish = (cancel) => {
    label.contentEditable = 'false';
    let text = cancel ? (label.dataset.old || '') : label.textContent;
    text = String(text).replace(/\s+/g, ' ').trim();
    if (!text) text = label.dataset.old || '未命名';
    node.label = text;
    label.textContent = text;
    if (node.note) {
      const box = label.closest('.box');
      const n = box && box.querySelector('.note');
      if (n) n.textContent = node.note;
    }
    save(); drawLinks(); select(node.id);
  };

  const onKey = e => {
    if (e.key === 'Enter') { e.preventDefault(); label.blur(); }
    if (e.key === 'Escape') { e.preventDefault(); label.dataset.cancel = '1'; label.blur(); }
  };
  label.addEventListener('keydown', onKey);
  label.addEventListener('paste', e => {
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, text.replace(/\s+/g, ' '));
  });
  label.addEventListener('blur', () => {
    label.removeEventListener('keydown', onKey);
    finish(label.dataset.cancel === '1');
    delete label.dataset.cancel;
  }, { once: true });
}

function startEditById(id, skipHistory){
  const label = document.querySelector('.label[data-id="' + id + '"]');
  const node = findNode(id);
  if (!label || !node) return;
  label.scrollIntoView({ block: 'center', behavior: 'smooth' });
  setTimeout(() => startEdit(label, node, skipHistory), 120);
}

function addChild(parent){
  snapshot();
  const child = { id: newId(), label: '新功能', note: '', children: [], collapsed: false };
  parent.children.push(child);
  parent.collapsed = false;
  state.selected = child.id;
  save(); render(); drawLinks(); select(child.id);
  setTimeout(() => startEditById(child.id, true), 60);
}
function addSibling(node){
  if (node.id === state.tree.id) { addChild(node); return; }
  const parent = findParent(node.id);
  if (!parent) return;
  snapshot();
  const sib = { id: newId(), label: '新功能', note: '', children: [], collapsed: false };
  const idx = parent.children.findIndex(c => c.id === node.id);
  parent.children.splice(idx + 1, 0, sib);
  state.selected = sib.id;
  save(); render(); drawLinks(); select(sib.id);
  setTimeout(() => startEditById(sib.id, true), 60);
}
function deleteNode(node){
  if (node.id === state.tree.id) return;
  const parent = findParent(node.id);
  if (!parent) return;
  if (!confirm('删除「' + node.label + '」及其子节点？')) return;
  snapshot();
  parent.children = parent.children.filter(c => c.id !== node.id);
  state.selected = parent.id;
  save(); render(); drawLinks();
  setTimeout(() => select(parent.id), 30);
  showToast('已删除');
}
function toggleNode(node){
  if (!node.children.length) return;
  snapshot();
  node.collapsed = !node.collapsed;
  save(); render(); drawLinks();
}

/* ============================================================
   5. 搜索
   ============================================================ */
let searchTimer = 0;
function doSearch(q){
  q = (q || '').trim().toLowerCase();
  state.hits = new Set();
  state.selected = null;
  hideNodebar();
  if (!q) {
    $$('.label.hit').forEach(el => el.classList.remove('hit'));
    return;
  }
  const hits = [];
  const rec = (node) => {
    const self = (node.label + ' ' + node.note).toLowerCase().includes(q);
    let child = false;
    node.children.forEach(c => { if (rec(c)) child = true; });
    if (self || child) {
      state.hits.add(node.id);
      if (child) node.collapsed = false;
      if (self) hits.push(node.id);
    }
    return self || child;
  };
  rec(state.tree);
  render();
  requestAnimationFrame(() => {
    $$('.label').forEach(el => {
      if (state.hits.has(el.dataset.id)) el.classList.add('hit');
    });
    if (hits.length) {
      const first = document.querySelector('.box[data-id="' + hits[0] + '"]');
      if (first) first.scrollIntoView({ block: 'center', behavior: 'smooth' });
      showToast('找到 ' + hits.length + ' 个匹配');
    } else {
      showToast('没有匹配的功能');
    }
  });
}

/* ============================================================
   6. 缩放 / 适应
   ============================================================ */
function setZoom(z){
  state.scale = Math.max(0.28, Math.min(1.6, z));
  canvas.style.zoom = state.scale;
  $('#zoomLabel').textContent = Math.round(state.scale * 100) + '%';
  requestAnimationFrame(drawLinks);
  save();
}
function fit(){
  const vw = viewport.clientWidth || 1200;
  const vh = viewport.clientHeight || 700;
  const w = nodesEl.scrollWidth + 150;
  const h = nodesEl.scrollHeight + 110;
  let z = Math.min((vw - 16) / w, (vh - 16) / h, 1);
  setZoom(Math.max(0.3, z));
  requestAnimationFrame(() => {
    viewport.scrollLeft = 0;
    viewport.scrollTop = Math.max(0, (viewport.scrollHeight - viewport.clientHeight) / 2);
  });
}
function expandAll(){
  walk(state.tree, n => { if (n.children.length) n.collapsed = false; });
  save(); render(); drawLinks();
  setTimeout(() => { viewport.scrollTo({ left: 0, top: 0, behavior: 'smooth' }); }, 60);
}
function collapseAll(){
  walk(state.tree, n => { if (n.children.length) n.collapsed = n.id !== state.tree.id; });
  save(); render(); drawLinks(); setTimeout(fit, 60);
}

/* ============================================================
   7. 导出 / 导入 / 重置 / 主题
   ============================================================ */
function exportJSON(){
  const payload = { app: 'TickFlow', map: 'M3 双岛', version: 1, exportedAt: new Date().toISOString(), tree: state.tree };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tickflow-m3-dual-island-tree.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  showToast('已导出 JSON');
}
function importJSON(file){
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      const tree = normalize(parsed.tree || parsed);
      if (!tree) throw new Error('no tree');
      snapshot();
      state.tree = tree;
      state.selected = null;
      save(); render(); drawLinks(); fit();
      showToast('已导入');
    } catch (e) {
      showToast('导入失败：不是有效的 JSON 树');
    }
  };
  reader.readAsText(file, 'utf-8');
}
function resetTree(){
  if (!confirm('恢复默认 M3 功能树？当前编辑会丢失。')) return;
  snapshot();
  state.tree = defaultTree();
  state.selected = null;
  save(); render(); drawLinks(); fit();
  showToast('已恢复默认树');
}
function toggleTheme(){
  state.theme = state.theme === 'light' ? 'dark' : 'light';
  document.body.dataset.theme = state.theme;
  $('#themeBtn').textContent = state.theme === 'light' ? '深色' : '浅色';
  save();
}

   8. 事件绑定
   ============================================================ */
function bind(){
  $('#search').addEventListener('input', e => {
    clearTimeout(searchTimer);
    const v = e.target.value;
    searchTimer = setTimeout(() => doSearch(v), 160);
  });
  $('#search').addEventListener('keydown', e => {
    if (e.key === 'Escape') { e.target.value = ''; doSearch(''); }
  });

  document.querySelectorAll('[data-act]').forEach(btn => {
    btn.addEventListener('click', () => {
      const act = btn.dataset.act;
      if (act === 'expand-all') expandAll();
      if (act === 'collapse-all') collapseAll();
      if (act === 'fit') fit();
      if (act === 'zoom-in') setZoom(state.scale + 0.1);
      if (act === 'zoom-out') setZoom(state.scale - 0.1);
      if (act === 'export') exportJSON();
      if (act === 'import') $('#file-input').click();
      if (act === 'reset') resetTree();
      if (act === 'theme') toggleTheme();
    });
  });

  $('#file-input').addEventListener('change', e => {
    const file = e.target.files && e.target.files[0];
    if (file) importJSON(file);
    e.target.value = '';
  });

  document.querySelectorAll('[data-node-act]').forEach(btn => {
    btn.addEventListener('click', () => {
      const node = findNode(state.selected);
      if (!node) return;
      const act = btn.dataset.nodeAct;
      if (act === 'child') addChild(node);
      if (act === 'sibling') addSibling(node);
      if (act === 'rename') startEditById(node.id);
      if (act === 'toggle') toggleNode(node);
      if (act === 'delete') deleteNode(node);
    });
  });

  viewport.addEventListener('click', e => {
    if (e.target === viewport || e.target === canvas || e.target === nodesEl) clearSelection();
  });

  // 拖动空白处平移
  let pan = null;
  viewport.addEventListener('pointerdown', e => {
    if (e.target.closest('.box') || e.target.closest('button') || e.target.closest('input')) return;
    pan = { x: e.clientX, y: e.clientY, sl: viewport.scrollLeft, st: viewport.scrollTop };
    viewport.classList.add('dragging');
    try { viewport.setPointerCapture(e.pointerId); } catch (_) {}
  });
  viewport.addEventListener('pointermove', e => {
    if (!pan) return;
    viewport.scrollLeft = pan.sl - (e.clientX - pan.x);
    viewport.scrollTop = pan.st - (e.clientY - pan.y);
  });
  const endPan = () => { pan = null; viewport.classList.remove('dragging'); };
  viewport.addEventListener('pointerup', endPan);
  viewport.addEventListener('pointercancel', endPan);

  // Ctrl + 滚轮缩放
  viewport.addEventListener('wheel', e => {
    if (!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    setZoom(state.scale + (e.deltaY < 0 ? 0.06 : -0.06));
  }, { passive: false });

  document.addEventListener('keydown', e => {
    const editing = document.activeElement && document.activeElement.isContentEditable;
    if (editing) return;
    const meta = e.ctrlKey || e.metaKey;
    if (meta && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (meta && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
    if (e.key === 'F2' && state.selected) { e.preventDefault(); startEditById(state.selected); return; }
    if (e.key === 'Delete' && state.selected) {
      const node = findNode(state.selected);
      if (node) { e.preventDefault(); deleteNode(node); }
      return;
    }
    if (e.key === 'Escape') { clearSelection(); return; }
    if (e.key === 'Tab' && state.selected) {
      // Tab 在选中节点上新增子节点，Shift+Tab 新增同级
      e.preventDefault();
      const node = findNode(state.selected);
      if (node) e.shiftKey ? addSibling(node) : addChild(node);
    }
  });

  // 尺寸变化后重画连线
  if (window.ResizeObserver) {
    const ro = new ResizeObserver(() => requestAnimationFrame(drawLinks));
    ro.observe(nodesEl);
    ro.observe(canvas);
  }
  window.addEventListener('resize', () => requestAnimationFrame(drawLinks));
  document.fonts && document.fonts.ready && document.fonts.ready.then(() => requestAnimationFrame(drawLinks));
}

/* ============================================================
   9. 初始化
   ============================================================ */
function init(){
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(LS_TREE) || 'null'); } catch (_) {}
  state.tree = saved ? normalize(saved) : defaultTree();
  if (!state.tree) state.tree = defaultTree();

  let ui = {};
  try { ui = JSON.parse(localStorage.getItem(LS_UI) || '{}'); } catch (_) {}
  state.theme = ui.theme === 'dark' ? 'dark' : 'light';
  document.body.dataset.theme = state.theme;
  $('#themeBtn').textContent = state.theme === 'light' ? '深色' : '浅色';

  bind();
  render();
  requestAnimationFrame(() => {
    if (typeof ui.scale === 'number' && ui.scale >= 0.3 && ui.scale <= 1.6) {
      setZoom(ui.scale);
    } else {
      fit();
    }
  });
}

function updateStats(){
  const c = countTree(state.tree);
  $('#stat-nodes').textContent = c.nodes;
  $('#stat-leaves').textContent = c.leaves;
  $('#stat-depth').textContent = c.maxDepth;
}

init();
</script>
